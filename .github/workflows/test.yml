name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# un nuovo push sulla stessa branch annulla il run precedente ancora in corso
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # jsdom 30 dichiede ^22.22.2 || ^24.15.0 || >=26.0.0
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Installa le dipendenze dal lockfile (servono solo per i test)
        run: npm ci --ignore-scripts
      - name: Esegui i test
        run: npm test

  test-bun:
    name: Bun
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # pinnato: "latest" renderebbe la CI dipendente da un rilascio di Bun
          bun-version: 1.4.2
      - name: Installa le dipendenze (bun.lock congelato)
        run: bun install --frozen-lockfile
      - name: Esegui i test
        run: bun run test
