name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# un nuovo push sulla stessa branch annulla il run precedente ancora in corso
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-bun:
    name: Bun
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # pinnato: "latest" renderebbe la CI dipendente da un rilascio di Bun
          bun-version: 1.4.2
      - name: Installa le dipendenze (bun.lock congelato)
        run: bun install --frozen-lockfile
      - name: Installa Chromium per i test browser
        run: bunx playwright install --with-deps chromium
      - name: Esegui i test
        run: bun run test
